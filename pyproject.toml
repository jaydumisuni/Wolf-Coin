[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-coin-core"
version = "0.1.0a0"
description = "Wolf-Coin deterministic research and paper-only first light"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wolf = "wolf_core.cli:main"
wolf-paper = "wolf_core.paper_operator:run"
wolf-dashboard = "wolf_gateway.dashboard:main"
wolf-resident = "wolf_gateway.resident:main"

[tool.setuptools.packages.find]
include = ["wolf_core*", "wolf_sports*", "wolf_guard*", "wolf_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
