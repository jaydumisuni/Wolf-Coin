[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-coin-core"
version = "0.1.0a0"
description = "Wolf-Coin deterministic research and paper-only first light"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["wolf_core*", "wolf_sports*", "wolf_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
