name: PR Review (Sergeant-style)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  coordinator:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.detect.outputs.files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1 || true
          files=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | tr '\n' ',' | sed 's/,$//')
          if [ -z "$files" ]; then
            files=$(git ls-tree -r --name-only HEAD | tr '\n' ',')
          fi
          echo "Changed files: $files"
          echo "::set-output name=files::$files"

  specialists:
    needs: coordinator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        specialist: [scout, analyst, strategist, risk_officer, execution_officer]
    uses: ./.github/workflows/review-worker.yml
    with:
      specialist: ${{ matrix.specialist }}
      changed_files: ${{ needs.coordinator.outputs.changed_files }}
      pr_number: ${{ github.event.pull_request.number }}

  consensus:
    needs: specialists
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine evidence artifacts into consensus.json
        run: |
          python - <<'PY'
import json, os
out = []
for root, dirs, files in os.walk('artifacts'):
    for f in files:
        p = os.path.join(root, f)
        try:
            out.append(json.load(open(p)))
        except Exception:
            try:
                out.append({"artifact": p, "content": open(p, 'r', encoding='utf8', errors='ignore').read()})
            except Exception:
                out.append({"artifact": p, "error": "could not read"})
open('consensus.json','w', encoding='utf8').write(json.dumps(out, indent=2))
PY

      - name: Upload consensus artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-consensus-${{ github.event.pull_request.number }}
          path: consensus.json

      - name: Post PR comment with short summary
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('consensus.json','utf8');
            const preview = body.substring(0, 1800);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Sergeant-style review consensus (automatically generated).\n\nPreview:\n\n\`\`\`json\n${preview}\n\`\`\`\n\nFull artifacts are attached to the workflow run.`
            })
